# ===================================================================
# MachiTodo 后端配置
# 启动前请先执行 sql/schema.sql 建库建表，并按自己的环境改下面三项：
#   url 里的数据库名、username、password
# ===================================================================
server:
  # 前端 main.js 里的 API_BASE 默认指向 8080，改端口记得同步改前端
  port: 8080

spring:
  application:
    name: machi-todo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库地址：useSSL=false 关掉 SSL 警告，serverTimezone 防止时区报错
    url: jdbc:mysql://localhost:3306/machi_todo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

# MyBatis 配置
mybatis:
  # 打印执行的 SQL 到控制台，方便调试；上线可以换成 logging.level 的方式
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.machi.todo: debug
